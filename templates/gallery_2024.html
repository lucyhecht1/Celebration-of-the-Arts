{% extends "layout.html" %}

{% block title %}Gallery 2024 - Yavneh Celebration of the Arts{% endblock %}

{% block content %}
<section class="about-hero">
    <div class="container text-center white-text">
        <h1>Gallery 2024</h1>
    </div>
</section>
<section class="gallery-2024">
    <div class="container">
        <div id="gallery-grid" class="row">
            <!-- Images rendered by JavaScript pagination -->
        </div>
        <div class="pagination-controls text-center my-4">
            <button class="btn btn-outline-secondary me-2" id="prevBtn" onclick="changePage(-1)">&#10094; Prev</button>
            <span id="pageIndicator" class="mx-3 fw-semibold"></span>
            <button class="btn btn-outline-secondary ms-2" id="nextBtn" onclick="changePage(1)">Next &#10095;</button>
        </div>
    </div>
</section>

<!-- Modal -->
<div id="imageModal" class="modal">
    <span class="close" onclick="closeModal()">&times;</span>
    <img class="modal-content" id="modalImg">
    <div id="caption"></div>
    <!-- Navigation Buttons -->
    <button class="prev" onclick="changeImage(-1)">&#10094;</button>
    <button class="next" onclick="changeImage(1)">&#10095;</button>
    <!-- Download Button -->
    <a id="downloadBtn" class="download" href="#" download>Download</a>
</div>

<script>
    // --- Pagination ---
    const skipSet = new Set([40, 67, 68, 69, 147]);
    const imageIndices = [];
    for (let i = 1; i <= 180; i++) {
        if (!skipSet.has(i)) imageIndices.push(i);
    }

    const IMAGES_PER_PAGE = 30;
    let currentPage = 1;
    const totalPages = Math.ceil(imageIndices.length / IMAGES_PER_PAGE);

    function renderPage(page) {
        const grid = document.getElementById('gallery-grid');
        grid.innerHTML = '';
        const start = (page - 1) * IMAGES_PER_PAGE;
        const end = Math.min(start + IMAGES_PER_PAGE, imageIndices.length);

        for (let j = start; j < end; j++) {
            const i = imageIndices[j];
            const col = document.createElement('div');
            col.className = 'col-md-4 col-sm-6 mb-4';
            col.innerHTML = `<img
                src="/static/images/gallery2024_compressed/image${i}.webp"
                alt="Gallery Image ${i}"
                class="img-fluid gallery-image"
                onclick="openModal(${i})"
                loading="lazy">`;
            grid.appendChild(col);
        }

        document.getElementById('pageIndicator').textContent = `Page ${page} of ${totalPages}`;
        document.getElementById('prevBtn').disabled = page === 1;
        document.getElementById('nextBtn').disabled = page === totalPages;
    }

    function changePage(direction) {
        const newPage = currentPage + direction;
        if (newPage < 1 || newPage > totalPages) return;
        currentPage = newPage;
        renderPage(currentPage);
        document.querySelector('.gallery-2024').scrollIntoView({ behavior: 'smooth' });
    }

    renderPage(1);

    // --- Modal ---
    let currentIndex = 0;
    const totalImages = 180;

    function openModal(index) {
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImg');
        const downloadBtn = document.getElementById('downloadBtn');

        while (skipSet.has(index)) {
            index++;
            if (index > totalImages) index = 1;
        }

        currentIndex = index;
        modal.style.display = 'block';
        modalImg.src = `/static/images/gallery2024_compressed/image${index}.webp`;
        downloadBtn.href = modalImg.src;
        document.body.classList.add('modal-open');
    }

    function closeModal() {
        document.getElementById('imageModal').style.display = 'none';
        document.body.classList.remove('modal-open');
    }

    function changeImage(direction) {
        const modalImg = document.getElementById('modalImg');
        const downloadBtn = document.getElementById('downloadBtn');

        currentIndex += direction;
        if (currentIndex < 1) currentIndex = totalImages;
        else if (currentIndex > totalImages) currentIndex = 1;

        while (skipSet.has(currentIndex)) {
            currentIndex += direction;
            if (currentIndex < 1) currentIndex = totalImages;
            else if (currentIndex > totalImages) currentIndex = 1;
        }

        modalImg.src = `/static/images/gallery2024_compressed/image${currentIndex}.webp`;
        downloadBtn.href = modalImg.src;
    }

    document.addEventListener('keydown', function (event) {
        const modal = document.getElementById('imageModal');
        if (modal.style.display === 'block') {
            if (event.key === 'Escape') closeModal();
            else if (event.key === 'ArrowLeft') changeImage(-1);
            else if (event.key === 'ArrowRight') changeImage(1);
        }
    });

    const modalElement = document.getElementById('imageModal');
    let touchStartX = 0;
    let touchEndX = 0;
    const swipeThreshold = 50;

    modalElement.addEventListener('touchstart', function (event) {
        touchStartX = event.changedTouches[0].screenX;
    });

    modalElement.addEventListener('touchend', function (event) {
        touchEndX = event.changedTouches[0].screenX;
        const deltaX = touchEndX - touchStartX;
        if (Math.abs(deltaX) > swipeThreshold) {
            changeImage(deltaX < 0 ? 1 : -1);
        }
    });
</script>

{% endblock %}
